name: Build DMC Companion Firmwares

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'dmc-companion-*'

jobs:
  build:
    # Build every companion board (usb + ble variants) via the shared matrix
    # builder. Draft release on tag push.
    uses: ./.github/workflows/firmware-builder.yml
    with:
      firmware_type: 'companion'
      release_title_prefix: 'DMC Companion Firmware'
