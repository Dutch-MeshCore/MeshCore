name: Build Repeater MQTT Firmwares

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Firmware version, e.g. v1.16.0 (used as FIRMWARE_VERSION and release name)'
        required: true
        type: string
  push:
    tags:
      - 'dmc-repeater-mqtt-*'

jobs:

  build:
    runs-on: ubuntu-latest
    steps:

      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmwares
        env:
          FIRMWARE_VERSION: ${{ inputs.version || env.GIT_TAG_VERSION }}
          OUT_DIR: .prebuilt
        run: /usr/bin/env bash build.sh build-repeater-mqtt-firmwares

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repeater-mqtt-firmwares
          path: .prebuilt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          # On manual dispatch there is no tag ref, so synthesize one from the input version.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('dmc-repeater-mqtt-{0}', inputs.version) || github.ref_name }}
          name: Repeater MQTT Firmware ${{ inputs.version || env.GIT_TAG_VERSION }}
          body: ""
          draft: true
          files: .prebuilt/*
