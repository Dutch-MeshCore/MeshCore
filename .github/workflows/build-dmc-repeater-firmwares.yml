name: Build DMC Repeater Firmwares

permissions:
  contents: write

on:
  # Dispatch-only. DMC releases are built locally (scripts/publish-release.sh) to
  # avoid spending Actions runner minutes; the "Run workflow" button remains as a
  # runner fallback. Pushing a dmc-repeater-* tag no longer auto-builds.
  workflow_dispatch:

jobs:
  build:
    # Build every repeater board via the shared matrix builder (was a temporary
    # curated subset; DMC now ships the full set). Draft release on tag push.
    uses: ./.github/workflows/firmware-builder.yml
    with:
      firmware_type: 'repeater'
      release_title_prefix: 'DMC Repeater Firmware'
