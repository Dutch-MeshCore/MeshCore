name: Build DMC Repeater Firmwares

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Firmware version, e.g. v1.16.0 (used as FIRMWARE_VERSION and release name)'
        required: true
        type: string
  push:
    tags:
      - 'dmc-repeater-*'
      - '!dmc-repeater-mqtt-*'   # MQTT observer builds are handled by build-repeater-mqtt-firmwares.yml

jobs:

  build:
    runs-on: ubuntu-latest
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmwares
        env:
          FIRMWARE_VERSION: ${{ inputs.version || env.GIT_TAG_VERSION }}
        run: /usr/bin/env bash build.sh build-dmc-repeater-firmwares

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dmc-repeater-firmwares
          path: out

  # Release runs as a separate job so that a flaky asset upload can be
  # re-run on its own (downloading the already-built artifact) without
  # recompiling all firmwares.
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:

      # GITHUB_ENV does not carry across jobs, so re-derive the version here.
      # Manual runs use the workflow_dispatch `version` input; tag pushes derive it
      # from the tag (e.g. "dmc-repeater-v1.2.3" -> "v1.2.3").
      - name: Determine Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "GIT_TAG_VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          else
            GIT_TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "GIT_TAG_VERSION=${GIT_TAG_NAME##*-}" >> $GITHUB_ENV
          fi

      - name: Download Firmware Artifacts
        uses: actions/download-artifact@v7
        with:
          name: dmc-repeater-firmwares
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          # On manual dispatch there is no tag ref, so synthesize one from the input version.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('dmc-repeater-{0}', inputs.version) || github.ref_name }}
          name: DMC Repeater Firmware ${{ env.GIT_TAG_VERSION }}
          body: ""
          draft: true
          files: out/*
