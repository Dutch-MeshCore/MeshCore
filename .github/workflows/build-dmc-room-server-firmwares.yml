name: Build DMC Room Server Firmwares

permissions:
  contents: write

on:
  # Dispatch-only. DMC releases are built locally (scripts/publish-release.sh) to
  # avoid spending Actions runner minutes; the "Run workflow" button remains as a
  # runner fallback. Pushing a dmc-room-server-* tag no longer auto-builds.
  workflow_dispatch:

jobs:
  build:
    # Build every room-server board via the shared matrix builder. Draft
    # release on tag push.
    uses: ./.github/workflows/firmware-builder.yml
    with:
      firmware_type: 'room-server'
      release_title_prefix: 'DMC Room Server Firmware'
