name: Build DMC Room Server Firmwares

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'dmc-room-server-*'
      # Exclude the observer MQTT room-server tags (they have their own
      # workflow). 'dmc-room-server-*' otherwise also matches
      # 'dmc-room-server-mqtt-*'.
      - '!dmc-room-server-mqtt-*'
      # Exclude the packetlog firmware tags: those releases are published from
      # locally pre-built bins (local publish flow), so a runner rebuild would
      # only waste minutes and could clobber the uploaded assets.
      - '!dmc-room-server-packetlog-*'

jobs:
  build:
    # Build every room-server board via the shared matrix builder. Draft
    # release on tag push.
    uses: ./.github/workflows/firmware-builder.yml
    with:
      firmware_type: 'room-server'
      release_title_prefix: 'DMC Room Server Firmware'
